<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GitHub Viewer デモ</title>
<style>
  body { font: 15px/1.7 -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 32px;
         background: #0d1117; color: #e6edf3; }
  .card { max-width: 560px; margin: 0 auto; background: #161b22; border: 1px solid #30363d;
          border-radius: 12px; padding: 24px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #30363d;
           background: #238636; color: #fff; cursor: pointer; }
  button:hover { background: #2ea043; }
  output { display: block; margin-top: 16px; font-size: 28px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <h1>JavaScript も動きます</h1>
    <p>このファイルを GitHub Viewer で開くと、HTML と JavaScript がそのまま実行されます。
       ボタンを押すとカウントが増え、コンソールペインにログが流れます。</p>
    <button id="count">カウントする</button>
    <output id="value">0</output>
  </div>
  <script>
    let count = 0;
    const value = document.getElementById("value");
    document.getElementById("count").addEventListener("click", () => {
      count += 1;
      value.textContent = count;
      console.log("クリック回数:", count);
    });
    console.log("デモページを読み込みました:", new Date().toISOString());
  </script>
</body>
</html>
